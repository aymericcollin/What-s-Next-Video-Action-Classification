# @package _global_
training:
  device: cuda
  batch_size: 32
  num_workers: 4
  head_only_epochs: 0            # no head-only phase — train all from scratch
  epochs: 100
  lr: 1.0e-3
  warmup_epochs: 5
  weight_decay: 0.05
  grad_clip: 1.0
  use_mixup: true
  mixup_alpha: 0.8
  label_smoothing: 0.1
  weighted_sampler: true
  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/closed/best_model.pt
  resume_path: ${hydra:runtime.cwd}/checkpoints/closed/latest_checkpoint.pt
