# @package _global_
dataset:
  train_dir: ${hydra:runtime.cwd}/processed_data/train
  val_dir: ${hydra:runtime.cwd}/processed_data/val
  merge_val_to_train: true       # combine train+val, then carve out sidecar
  test_dir: ${hydra:runtime.cwd}/processed_data/test
  submission_output: ${hydra:runtime.cwd}/submission_closed.csv
  num_frames: 16
  image_size: 224
  val_ratio: 0.05                # 5% sidecar holdout for monitoring
  seed: 42
  max_samples: null
  random_crop: false
  color_jitter: false
  use_rrc: true                  # RandomResizedCrop instead of Resize+Crop
  rand_augment: true             # RandAugment(num_ops=2, magnitude=9)
  random_erasing: true           # RandomErasing(p=0.25)
  hflip_prob: 0.5                # horizontal flip with label swap
  hflip_label_map:               # classes that mirror each other under HFlip
    18: 19
    19: 18
