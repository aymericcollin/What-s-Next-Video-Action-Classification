# @package _global_
# Same as vjepa2 but with hard-class oversampling weights
# Based on per-class val accuracy analysis (see analyze_per_class.py)
dataset:
  train_dir: ${hydra:runtime.cwd}/processed_data/train
  val_dir: ${hydra:runtime.cwd}/processed_data/val
  test_dir: ${hydra:runtime.cwd}/processed_data/test
  submission_output: ${hydra:runtime.cwd}/submission_vjepa2_balanced.csv

  image_size: 256
  num_frames: 16
  val_ratio: 0.0
  seed: 42
  max_samples: null
  random_crop: true
  color_jitter: true

  # Extra sampling weight multipliers for hard classes (on top of frequency balancing)
  # Derived from per-class val accuracy: lower acc → higher multiplier
  hard_class_weights:
    16: 3.0   # Pretending to put into something       — 19.1%
    22: 2.0   # Putting something into something        — 40.8%
    9:  2.0   # Moving something up                     — 43.5%
    25: 2.0   # Showing something to the camera         — 45.2%
    17: 2.0   # Pretending to throw something           — 46.8%
    24: 2.0   # Putting something onto something        — 47.5%
    11: 1.5   # Picking something up                    — 49.7%
    14: 1.5   # Pretending to pick something up         — 50.4%
    15: 1.5   # Pretending to pour something out        — 55.4%
    5:  1.3   # Holding something                       — 56.3%
    23: 1.3   # Putting something next to something     — 56.7%
    4:  1.3   # Hitting something with something        — 57.0%
